<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Wishlist | DESIGN HER</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:'DM Sans',sans-serif}.top{padding:12px 18px;text-align:center;border-bottom:1px solid #242424;font-size:10px;letter-spacing:2px}.nav{max-width:1100px;margin:auto;padding:24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929}.brand{font-weight:700;letter-spacing:5px;font-size:22px;color:#fff;text-decoration:none}.navlinks{display:flex;gap:20px}.navlinks a{color:#fff;text-decoration:none;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:30px 24px 70px}.eyebrow{font-size:10px;letter-spacing:3px;color:#aaa}.title{font-size:32px;letter-spacing:2px;margin:8px 0 28px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.item{border:1px solid #292929;padding:12px}.photo{width:100%;aspect-ratio:4/5;object-fit:cover;background:#171717;display:block}.name{font-size:15px;margin:12px 0 6px}.price{font-size:13px;color:#ccc}.remove{margin-top:12px;background:transparent;color:#fff;border:1px solid #666;padding:9px 13px;cursor:pointer}.empty{padding:45px 18px;border:1px solid #292929;color:#ccc;text-align:center}.empty a{display:inline-block;color:#fff;margin-top:18px;text-underline-offset:4px}.foot{border-top:1px solid #292929;padding:20px 24px;text-align:center;color:#aaa;font-size:11px;letter-spacing:2px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.nav{padding:18px}.brand{font-size:17px}.title{font-size:25px}.wrap{padding:25px 15px 50px}.item{padding:8px}}
</style></head><body><div class="top">A LITTLE JOY, THOUGHTFULLY CHOSEN · WELCOME TO DESIGN HER</div><header class="nav"><a class="brand" href="./">DESIGN HER</a><nav class="navlinks"><a href="shop.html">Shop</a><a href="cart.html">My Bag</a></nav></header><main class="wrap"><div class="eyebrow">SAVED WITH LOVE</div><h1 class="title">YOUR WISHLIST</h1><div id="items"><div class="empty">Loading your saved gifts…</div></div></main><footer class="foot">© 2026 DESIGN HER · THE GIFT EDIT</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const box=document.getElementById('items');
let saved=JSON.parse(localStorage.getItem('designHerWishlist')||'[]');
let products=JSON.parse(localStorage.getItem('designHerProducts')||'[]');
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function draw(){if(!saved.length){box.innerHTML='<div class="empty">Your wishlist is empty.<br><a href="shop.html">Explore gifts</a></div>';return;}const found=saved.map(id=>products.find(p=>String(p.id)===String(id))).filter(Boolean);box.innerHTML='<div class="grid">'+saved.map(id=>{const p=products.find(x=>String(x.id)===String(id));return '<article class="item">'+(p&&p.image_url||p&&p.image?'<img class="photo" src="'+esc(p.image_url||p.image)+'" alt="'+esc(p.name)+'">':'<div class="photo"></div>')+'<div class="name">'+esc(p?.name||'Saved gift')+'</div><div class="price">'+(p?'₹'+Number(p.price||0).toLocaleString('en-IN'):'Saved item')+'</div><button class="remove" data-remove="'+esc(id)+'">Remove</button></article>'}).join('')+'</div>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{saved=saved.filter(x=>String(x)!==String(b.dataset.remove));localStorage.setItem('designHerWishlist',JSON.stringify(saved));draw();});}
async function init(){const cfg=window.DESIGN_HER_SUPABASE||{};if(cfg.url&&cfg.anonKey&&window.supabase?.createClient){try{const client=window.supabase.createClient(cfg.url,cfg.anonKey);const {data,error}=await client.from('products').select('id,name,category,description,price,stock,image_url').eq('is_active',true);if(!error&&data){products=data.map(p=>({...p,cat:p.category,desc:p.description,image:p.image_url}));}}catch(e){console.error(e);}}draw();}
init();
</script></body></html>
