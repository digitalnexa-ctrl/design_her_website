<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Gift Bag | DESIGN HER</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>
:root{--cream:#f6f1e9;--paper:#fffdf9;--ink:#25231f;--muted:#777168;--gold:#b49462;--line:#e8dfd2}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}.wrap{max-width:1000px;margin:auto;padding:0 22px}.top{background:#26241f;color:#fff;text-align:center;padding:9px;font-size:10px;letter-spacing:1px}.nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}.brand{font:600 25px 'Playfair Display',serif;letter-spacing:3px}.nav a{color:inherit;text-decoration:none;font-size:12px}.title{font:38px 'Playfair Display',serif;margin:38px 0 20px}.row{display:grid;grid-template-columns:90px 1fr auto;gap:15px;align-items:center;background:var(--paper);border:1px solid var(--line);padding:14px;margin:10px 0}.row img{width:90px;height:100px;object-fit:cover;background:#eee5d8}.name{font:18px 'Playfair Display',serif}.muted{font-size:11px;color:var(--muted)}.qty{display:flex;align-items:center;gap:8px;margin-top:9px}.qty button,.remove{background:white;border:1px solid var(--line);padding:5px 10px}.remove{color:#985c54;margin-top:7px}.summary{background:var(--paper);border:1px solid var(--line);padding:22px;margin:24px 0 60px;max-width:400px;margin-left:auto}.sumrow{display:flex;justify-content:space-between;padding:8px 0;font-size:12px}.btn{display:block;background:var(--ink);color:white;text-align:center;text-decoration:none;padding:14px;margin-top:14px;font-size:11px}.empty{padding:50px;text-align:center;background:var(--paper);color:var(--muted)}@media(max-width:600px){.row{grid-template-columns:70px 1fr}.row img{width:70px;height:80px}.row>strong{grid-column:2}.title{font-size:30px}}
</style><link rel="stylesheet" href="assets/css/premium-gold.css?v=20261110-font2"></head><body><div class="top">THOUGHTFUL GIFTS FOR EVERY OCCASION · DESIGN HER</div><header class="wrap nav"><a class="brand" href="./">DESIGN HER</a><a href="shop.html">Continue shopping</a></header><main class="wrap"><h1 class="title">Your gift bag</h1><div id="items"></div><section class="summary" id="summary" hidden><div class="sumrow"><span>Subtotal</span><strong id="subtotal"></strong></div><div class="sumrow"><span>Shipping</span><span>Calculated at checkout</span></div><div class="muted">Checkout and payment will be enabled after the store's delivery and payment gateway setup is completed.</div><a class="btn" href="checkout.html">Continue to checkout</a></section></main><script>
const $=id=>document.getElementById(id);let cart=JSON.parse(localStorage.getItem('designHerCart')||'[]');
function money(v){return '₹'+Number(v).toLocaleString('en-IN')}function save(){localStorage.setItem('designHerCart',JSON.stringify(cart));draw()}
function draw(){$('items').innerHTML=cart.length?cart.map((p,i)=>'<article class="row">'+(p.image_url?'<img src="'+p.image_url+'" alt="">':'<div style="width:90px;height:100px;background:#eee5d8;display:grid;place-items:center">✦</div>')+'<div><div class="name">'+p.name+'</div><div class="muted">'+(p.notes||'')+'</div><div class="qty"><button data-dec="'+i+'">−</button><span>'+p.qty+'</span><button data-inc="'+i+'">+</button></div><button class="remove" data-remove="'+i+'">Remove</button></div><strong>'+money(p.price*p.qty)+'</strong></article>').join(''):'<div class="empty">Your bag is waiting for something lovely.<br><br><a href="shop.html">Explore gifts</a></div>';$('summary').hidden=!cart.length;$('subtotal').textContent=money(cart.reduce((n,p)=>n+p.price*p.qty,0));document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{let p=cart[+b.dataset.dec];p.qty=Math.max(1,p.qty-1);save()});document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{cart[+b.dataset.inc].qty++;save()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);save()})}draw();
</script></body></html>
