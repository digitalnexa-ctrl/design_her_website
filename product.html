<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gift Details | DESIGN HER</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>
:root{--cream:#f6f1e9;--paper:#fffdf9;--ink:#25231f;--muted:#777168;--gold:#b49462;--line:#e8dfd2}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 22px}.top{background:#26241f;color:#fff;text-align:center;padding:9px;font-size:10px;letter-spacing:1px}.nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}.brand{font:600 25px 'Playfair Display',serif;letter-spacing:3px}.nav a{text-decoration:none;color:inherit;font-size:12px}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;padding:48px 0}.gallery{background:#eee5d8;min-height:520px;display:grid;place-items:center}.gallery img{width:100%;height:100%;max-height:650px;object-fit:contain}.eyebrow{font-size:9px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}.title{font:38px 'Playfair Display',serif;margin:10px 0}.muted{font-size:12px;color:var(--muted);line-height:1.7}.price{font-size:20px;font-weight:700;margin:20px 0}.field{border:1px solid var(--line);padding:12px;background:#fff;font:12px 'DM Sans',sans-serif;width:100%;margin:7px 0 16px}.btn{border:0;background:var(--ink);color:white;padding:15px 20px;width:100%;font-size:11px;cursor:pointer;margin-top:8px}.qty{display:flex;align-items:center;gap:12px}.qty button{padding:8px 14px;border:1px solid var(--line);background:white}.notice{font-size:12px;color:#55745c;margin-top:12px}@media(max-width:720px){.layout{grid-template-columns:1fr;gap:22px;padding:24px 0}.gallery{min-height:350px}.title{font-size:30px}}
</style><link rel="stylesheet" href="assets/css/premium-gold.css?v=20261110-mono2"></head><body><div class="top">THOUGHTFUL GIFTS FOR EVERY OCCASION · DESIGN HER</div><header class="wrap nav"><a class="brand" href="./" style="text-decoration:none;color:inherit">DESIGN HER</a><a href="shop.html">Continue shopping</a></header><main class="wrap"><div class="layout"><div class="gallery" id="gallery">✦</div><section><div class="eyebrow" id="category">THE GIFT EDIT</div><h1 class="title" id="name">Loading gift…</h1><div class="price" id="price"></div><p class="muted" id="description"></p><label class="muted" for="personalisation">Personalisation notes (optional)</label><textarea class="field" id="personalisation" rows="3" placeholder="Name, message, colour or other custom details"></textarea><label class="muted" for="qty">Quantity</label><div class="qty"><button id="minus" type="button">−</button><input class="field" style="max-width:90px;text-align:center" id="qty" value="1" type="number" min="1"><button id="plus" type="button">+</button></div><button class="btn" id="add" disabled>Add to bag</button><button class="btn" id="buy" style="background:#b49462" disabled>Buy now</button><div class="notice" id="notice"></div><p class="muted">Secure checkout and delivery options will be shown when checkout is enabled.</p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const cfg=window.DESIGN_HER_SUPABASE||{},db=window.supabase?.createClient&&cfg.url&&cfg.anonKey?window.supabase.createClient(cfg.url,cfg.anonKey):null;let item=null;const $=id=>document.getElementById(id);$('minus').onclick=()=>{$('qty').value=Math.max(1,Number($('qty').value)-1)};$('plus').onclick=()=>{$('qty').value=Math.max(1,Number($('qty').value)+1)};
function putCart(go){if(!item)return;let cart=JSON.parse(localStorage.getItem('designHerCart')||'[]');let qty=Math.max(1,Number($('qty').value));const notes=$('personalisation').value.trim();const existing=cart.find(x=>x.id===item.id&&x.notes===notes);if(existing)existing.qty+=qty;else cart.push({id:item.id,name:item.name,price:item.price,image_url:item.image_url,qty,notes});localStorage.setItem('designHerCart',JSON.stringify(cart));$('notice').textContent='Added to your gift bag.';if(go)location.href='cart.html'}$('add').onclick=()=>putCart(false);$('buy').onclick=()=>putCart(true);
(async()=>{if(!db){$('name').textContent='Store connection unavailable';return}const id=new URLSearchParams(location.search).get('id');if(!id){$('name').textContent='Gift not found';return}const {data,error}=await db.from('products').select('*').eq('id',id).eq('is_active',true).maybeSingle();if(error||!data){$('name').textContent='Gift not found';return}item=data;$('name').textContent=data.name;$('category').textContent=data.category;$('price').textContent='₹'+Number(data.price).toLocaleString('en-IN');$('description').textContent=data.description||'A thoughtful gift, selected with care.';$('gallery').innerHTML=data.image_url?'<img src="'+data.image_url+'" alt="'+data.name+'">':'✦';$('add').disabled=Number(data.stock)<=0;$('buy').disabled=Number(data.stock)<=0;if(Number(data.stock)<=0)$('notice').textContent='Currently out of stock.'})();
</script></body></html>
