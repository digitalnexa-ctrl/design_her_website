<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Gifts | DESIGN HER</title><meta name="description" content="Shop personalised gifts, kids books, photo frames, hampers and thoughtful gifts for every occasion."><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>
:root{--cream:#f6f1e9;--paper:#fffdf9;--ink:#25231f;--muted:#777168;--gold:#b49462;--line:#e8dfd2}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1240px;margin:auto;padding:0 22px}.topbar{background:#26241f;color:#f8f2e8;text-align:center;padding:9px;font-size:10px;letter-spacing:1px}.nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid var(--line)}.brand{font:600 25px 'Playfair Display',serif;letter-spacing:3px}.navlinks{display:flex;gap:22px;font-size:11px}.navbtn{border:1px solid var(--line);background:transparent;padding:9px 12px;border-radius:3px;font-size:11px}.eyebrow{color:var(--gold);font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:700}.heading{font:38px 'Playfair Display',serif;margin:8px 0 20px}.muted{color:var(--muted);font-size:12px}.btn{background:var(--ink);color:white;border:0;padding:13px 18px;font-size:11px;cursor:pointer;border-radius:3px}.field{border:1px solid var(--line);background:white;padding:12px;font:12px 'DM Sans',sans-serif;border-radius:3px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:var(--paper);border:1px solid var(--line);padding:12px}.photo{aspect-ratio:4/5;background:#eee5d8;display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.card h3{font:18px 'Playfair Display',serif;margin:10px 0 4px}.card p{font-size:11px;color:var(--muted)}.price{font-size:13px;font-weight:700}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.footer{margin-top:70px;background:#26241f;color:#f8f2e8;padding:34px 0;font-size:11px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.filters button{background:#fff;border:1px solid var(--line);padding:9px 12px;font-size:10px}.filters button.active{background:#26241f;color:#fff}@media(max-width:700px){.navlinks{gap:9px}.navlinks a:nth-child(n+3){display:none}.heading{font-size:30px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.wrap{padding:0 14px}}
</style><link rel="stylesheet" href="assets/css/premium-gold.css"></head><body><div class="topbar">THOUGHTFUL GIFTS FOR EVERY OCCASION · DESIGN HER</div><header class="wrap nav"><a class="brand" href="./">DESIGN HER</a><nav class="navlinks"><a href="./">Home</a><a href="shop.html">Shop</a><a href="store-settings.html">Store</a></nav><a class="navbtn" href="cart.html">Bag (<span id="count">0</span>)</a></header><main class="wrap" style="padding-top:44px"><div class="eyebrow">The gift edit</div><h1 class="heading">Find something meaningful.</h1><p class="muted">Thoughtfully selected gifts for every person, moment and celebration.</p><div class="filters" id="filters"><button class="active" data-cat="All">All gifts</button><button data-cat="Personalised Gifts">Personalised Gifts</button><button data-cat="Kids Books">Kids Books</button><button data-cat="Birthday Gifts">Birthday Gifts</button><button data-cat="Anniversary Gifts">Anniversary Gifts</button><button data-cat="Photo Frames">Photo Frames</button><button data-cat="Gift Hampers">Gift Hampers</button><button data-cat="Corporate Gifts">Corporate Gifts</button><button data-cat="Handmade Gifts">Handmade Gifts</button></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin:18px 0"><input class="field" id="search" placeholder="Search gifts…" style="flex:1;min-width:180px"><select class="field" id="sort"><option value="new">Newest first</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="az">Name: A to Z</option></select></div><div class="grid" id="products"><p class="muted">Loading collection…</p></div></main><footer class="footer"><div class="wrap">DESIGN HER · Thoughtful gifts. Beautiful moments.</div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const cfg=window.DESIGN_HER_SUPABASE||{},db=window.supabase?.createClient&&cfg.url&&cfg.anonKey?window.supabase.createClient(cfg.url,cfg.anonKey):null;let all=[],category='All';const $=id=>document.getElementById(id);const cart=JSON.parse(localStorage.getItem('designHerCart')||'[]');$('count').textContent=cart.reduce((n,x)=>n+(x.qty||1),0);
function draw(){let q=$('search').value.toLowerCase(),list=all.filter(p=>(category==='All'||p.category===category)&&(p.name+' '+(p.description||'')).toLowerCase().includes(q));const s=$('sort').value;if(s==='low')list.sort((a,b)=>a.price-b.price);if(s==='high')list.sort((a,b)=>b.price-a.price);if(s==='az')list.sort((a,b)=>a.name.localeCompare(b.name));$('products').innerHTML=list.length?list.map(p=>'<article class="card"><a href="product.html?id='+p.id+'"><div class="photo">'+(p.image_url?'<img src="'+p.image_url+'" alt="'+p.name+'">':'✦')+'</div><h3>'+p.name+'</h3></a><p>'+p.category+'</p><div class="price">₹'+Number(p.price).toLocaleString('en-IN')+'</div><div class="actions"><a class="btn" style="text-align:center" href="product.html?id='+p.id+'">View product</a></div></article>').join(''):'<p class="muted">No products found. Please check back soon.</p>'}
$('filters').onclick=e=>{let b=e.target.closest('[data-cat]');if(!b)return;category=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));draw()};$('search').oninput=draw;$('sort').onchange=draw;
(async()=>{if(!db){$('products').textContent='Store connection is not configured.';return}const {data,error}=await db.from('products').select('id,name,category,description,price,stock,image_url,created_at').eq('is_active',true).gt('stock',0).order('created_at',{ascending:false});if(error){$('products').textContent=error.message;return}all=data||[];draw()})();
</script></body></html>
